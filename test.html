<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .test-result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>
    
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testRegister()" style="margin-left:10px;">Test Register</button>
    
    <div id="result" class="test-result">
        <h3>Result:</h3>
        <pre id="output">Click a button to test...</pre>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        async function testConnection() {
            const output = document.getElementById('output');
            output.textContent = 'Testing connection...';
            
            try {
                const response = await fetch(`${API_URL}/api/test`);
                const data = await response.json();
                output.innerHTML = `<span class="success">✅ Success!</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Failed to connect!</span>\nError: ${error.message}`;
            }
        }

        async function testRegister() {
            const output = document.getElementById('output');
            output.textContent = 'Testing registration...';
            
            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test_' + Date.now() + '@test.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    output.innerHTML = `<span class="success">✅ Registration successful!</span>\n${JSON.stringify(data, null, 2)}`;
                } else {
                    output.innerHTML = `<span class="error">❌ Registration failed!</span>\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Failed to connect!</span>\nError: ${error.message}`;
            }
        }
    </script>
</body>
</html>
